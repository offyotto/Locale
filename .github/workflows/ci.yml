name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: macos-15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate scripts
        run: |
          bash -n script/build_and_run.sh
          bash -n script/package_notarized.sh

      - name: Build release
        run: swift build -c release

